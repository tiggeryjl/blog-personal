spring:
  application:
    name: blog-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小(包括所有文件和表单数据)
      max-request-size: 100MB
  task:
    scheduling:
      #定时任务线程池调大一点，RSS 订阅发信不会拖慢每分钟的定时发布任务
      pool:
        size: 4

mybatis:
  #mapper配置文件
  mapper-locations: classpath:com/blog/mapper/*.xml
  type-aliases-package: com.blog.pojo.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true


blog:
  alioss:
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: blog-personal-yjl
    endpoint: oss-cn-beijing.aliyuncs.com
    region: cn-beijing
    scene-id: jvdry8hq
  jwt:
    user-secret-key: hello19990124xiaoyetongxuedegerenbokewangzhan
    user-token-name: Authorization
    user-ttl: 1200000
    user-refresh-Ttl: 604800000
  ai:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    flash:
      model: deepseek-flash           # DeepSeek官方Flash模型名
      temperature: 0.7
    pro:
      model: deepseek-v4-pro          # DeepSeek官方Pro/推理模型名
      temperature: 0.3
  rss:
    #站点地址/域名
    site-url: ${RSS_SITE_URL:http://localhost:5173}
    title: 小叶同学的博客
  mail:
    #新文章邮件通知开关
    enabled: ${MAIL_ENABLED:true}
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    ssl: ${MAIL_SSL:true}
    #发件邮箱
    username: ${MAIL_USERNAME:}
    #发件邮箱的SMTP授权码
    password: ${MAIL_PASSWORD:}
    from-name: 小叶同学的博客
